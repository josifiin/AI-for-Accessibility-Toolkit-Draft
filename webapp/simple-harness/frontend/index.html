<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Browser-Harness</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            padding: 1rem 2rem;
            background: var(--panel);
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .log-panel {
            width: 400px;
            background: var(--panel);
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }
        #log {
            flex: 1;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--muted);
            padding: 0.5rem;
            background: #00000044;
            border-radius: 4px;
        }
        .log-entry { margin-bottom: 0.5rem; border-left: 2px solid var(--accent); padding-left: 8px; }
        .log-entry.error { border-color: #ef4444; color: #fca5a5; }
        .log-entry.success { border-color: #22c55e; color: #86efac; }

        .viewport-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }
        #screenshot {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 4px;
        }
        .input-area {
            padding: 1.5rem 2rem;
            background: var(--panel);
            border-top: 1px solid #334155;
            display: flex;
            gap: 1rem;
        }
        input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            outline: none;
        }
        input:focus { border-color: var(--accent); }
        button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: var(--muted); cursor: not-allowed; }

        .status {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <div style="display:flex; align-items:center; gap: 10px;">
            <span style="font-size: 1.5rem;">🧠</span>
            <h1 style="font-size: 1.1rem; margin: 0; font-weight: 700;">Simple-Harness CLI</h1>
        </div>
        <div id="connection-status" style="font-size: 0.8rem; color: var(--muted);">Ready</div>
    </header>

    <div class="container">
        <div class="log-panel">
            <div class="status">Agent Activity Log</div>
            <div id="log"></div>
        </div>
        <div class="viewport-panel">
            <img id="screenshot" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Viewport">
            <div id="thinking-overlay" style="display:none; position:absolute; top: 20px; right: 20px; background: var(--accent); color: var(--bg); padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700;">THINKING...</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="task-input" placeholder="Type a command (e.g., 'Go to Wikipedia and find Alan Turing')">
        <button id="run-btn">Run Agent</button>
    </div>

    <script>
        const logEl = document.getElementById('log');
        const imgEl = document.getElementById('screenshot');
        const inputEl = document.getElementById('task-input');
        const btnEl = document.getElementById('run-btn');
        const connStatus = document.getElementById('connection-status');
        const thinkingOverlay = document.getElementById('thinking-overlay');

        let ws = null;

        function addLog(msg, type = 'log') {
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        btnEl.onclick = () => {
            const task = inputEl.value.trim();
            if (!task) return;

            btnEl.disabled = true;
            inputEl.disabled = true;
            logEl.innerHTML = '';
            addLog(`Initializing session for: ${task}`);
            connStatus.textContent = 'Connecting...';

            ws = new WebSocket(`ws://${location.host}/ws`);

            ws.onopen = () => {
                connStatus.textContent = 'Active';
                ws.send(task);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'log') {
                    addLog(data.message);
                    if (data.message.includes('thinking')) {
                        thinkingOverlay.style.display = 'block';
                    } else {
                        thinkingOverlay.style.display = 'none';
                    }
                } else if (data.type === 'screenshot') {
                    imgEl.src = `data:image/png;base64,${data.data}`;
                } else if (data.type === 'done') {
                    addLog(`Success: ${data.summary}`, 'success');
                    cleanup();
                } else if (data.type === 'error') {
                    addLog(`Error: ${data.message}`, 'error');
                    cleanup();
                }
            };

            ws.onclose = () => {
                connStatus.textContent = 'Disconnected';
                cleanup();
            };
        };

        function cleanup() {
            btnEl.disabled = false;
            inputEl.disabled = false;
            thinkingOverlay.style.display = 'none';
        }

        inputEl.onkeydown = (e) => { if (e.key === 'Enter') btnEl.click(); };
    </script>
</body>
</html>
